# A dance-off agent in pure Rust → wasm32-wasip2, built from PUBLIC
# artifacts only: the agent WIT world (vendored under wit/, canonical in
# github.com/lockstep-arena/lockstep-interface) and the FlatBuffers wire
# contract (contract/dance-off.fbs, same repo — `task contract` refreshes
# both). src/wire.rs is planus-generated from the .fbs and committed, so a
# plain `cargo build` needs no extra tools.
[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
planus = "1.3"
libm = "0.2"
serde = { version = "1", features = ["derive"] }  # planus-generated code derives serde

[profile.release]
opt-level = "s"
lto = true
