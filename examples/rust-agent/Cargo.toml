# A tensor-wire agent in pure Rust → wasm32-wasip2, built from PUBLIC
# artifacts only: the agent WIT world (vendored under wit/) and the tensor
# wire SPEC (docs/wire.md, vendored into this template) —
# re-implemented by hand in src/wire.rs, no codegen, no schema files.
# `cargo test` (host) pins the decoder against the spec's published golden
# encodings under tests/fixtures/.
[package]
name = "rust-agent"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.58"

[dependencies]
libm = "0.2"

[profile.release]
opt-level = "s"
lto = true
