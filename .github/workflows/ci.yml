# Proves the whole pipeline on every OS researchers actually use.
#
# dance-off is CI's named test slug — the one place outside docs/examples
# where an environment may be named. The template itself resolves
# environments from the CDN at runtime; CI just has to pick SOME release to
# train against. (The engine-backed steps fetch from the live CDN, so they
# go green with the first environments/ deploy.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU torch (Linux)
        # The default Linux torch wheel drags the full CUDA stack (~2.5 GB)
        # onto a runner with no GPU; the cpu index has the same version slim.
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the training stack
        run: |
          pip install -r requirements.txt
          pip install "lockstep-train[pettingzoo]>=0.3.3" pytest

      - name: Hermetic template tests (import lint, discovery vs a mock CDN, stage, network/export)
        run: python -m pytest tests -q

      - name: Rust example agent — hand-written wire decoder vs the spec goldens
        run: |
          rustup target add wasm32-wasip2
          cargo test --manifest-path examples/rust-agent/Cargo.toml --quiet
          cargo build --release --target wasm32-wasip2 --manifest-path examples/rust-agent/Cargo.toml

      - name: Fetch dance-off's current release (engine + generic shell)
        run: python -m train.core.engine --env dance-off --out out

      - name: Engine-backed tests (SAME_STEP autoreset semantics, parallel env)
        run: python -m pytest tests -q

      - name: Scripted agent through the full export/stage pipeline
        run: python -m examples.scripted_agent --env dance-off

      - name: Train through the full pipeline (tiny, vectorized, spawn workers)
        run: |
          python -m train.main --env dance-off --steps 256 --num-envs 2 \
            --engine out/engine.wasm --shell out/agent-onnx.wasm

      - name: Self-play (PARALLEL) through the same pipeline
        run: |
          python -m train.main --env dance-off --steps 128 --parallel \
            --engine out/engine.wasm --shell out/agent-onnx.wasm

      - name: The staged bundle is a valid v2 manifest
        run: |
          python - <<'PY'
          import tomllib
          m = tomllib.loads(open("out/agent-bundle/lockstep.toml").read())
          assert m["schema_version"] == 2 and m["environment"] == "dance-off", m
          print("bundle manifest ok:", m["environment"], m["mode"], m["payload_schema_version"])
          PY
