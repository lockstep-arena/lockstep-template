# The template's entire surface. Every task uses the repo-local .venv
# explicitly — no shell activation, no global installs.
#
# ENV=<slug> parameterizes everything: which environment's release to fetch,
# train against and submit to. There are no per-environment packages and no
# per-environment config in this repo — the CDN's `latest.json` names the
# release, and the engine wasm's own declaration describes the
# whole interface. dance-off is only the DEFAULT, as the shipped reference
# environment. Browse the catalog: https://lockstep.it/arenas
version: "3"

# Print what the task SAYS, not the shell line that says it. This is a
# teaching repo: `task train` should read as its own progress output, not as
# an echo of every `"{{.PY}}" -m train.core...` invocation ahead of it.
silent: true

dotenv: [".env"]

vars:
  VENV: "{{.ROOT_DIR}}/.venv"
  PY: "{{.VENV}}/bin/python"
  ENV: '{{.ENV | default "dance-off"}}'

tasks:
  setup:
    desc: "Create .venv and install the training stack (lockstep-train + torch/onnx). Nothing per-environment to install."
    cmds:
      - python3 -m venv "{{.VENV}}"
      - '"{{.VENV}}/bin/pip" install --upgrade pip'
      - '"{{.VENV}}/bin/pip" install -r requirements.txt'
      # The one Lockstep dependency. LOCKSTEP_TRAIN_SPEC overrides the PyPI
      # spec for local development against a checkout/wheel — e.g.
      #   task setup LOCKSTEP_TRAIN_SPEC="-e ../LOCKSTEP-PLATFORM/packages/mixed/lockstep-train[pettingzoo]"
      - '"{{.VENV}}/bin/pip" install {{.LOCKSTEP_TRAIN_SPEC | default "\"lockstep-train[pettingzoo]>=0.4.0\""}}'
      - 'echo "setup: ready — {{.ENV}}"'
      - 'echo "next: task info ENV={{.ENV}} (what the environment is), then task train ENV={{.ENV}} — or task quickstart ENV={{.ENV}} for the whole loop in one go"'

  engine:
    desc: "Download the release's engine.wasm + the generic agent shell (no-op if unchanged). ENV= MODE= VERSION="
    cmds:
      # `latest.json` on the CDN names the current release; the engine and
      # the generic ONNX agent shell are fetched from the same release
      # directory. `.url` stamps make re-runs and ENV/MODE switches cheap.
      - '"{{.PY}}" -m train.core.engine --env "{{.ENV}}" {{if .MODE}}--mode "{{.MODE}}"{{end}} {{if .VERSION}}--version "{{.VERSION}}"{{end}} --out out'

  info:
    desc: "Print the environment's brief and wire layout in the terminal — goal, reward, what ends an episode, every value and slice with units, the budgets — from the engine you will train against. ENV= MODE= (the same page as the Interface tab)"
    deps: [engine]
    cmds:
      # Runs the fetched engine for one reset and prints what THAT engine
      # declares, so what you read is exactly what `task train` builds
      # against. `--env` (the platform's record) is the no-download
      # alternative: python -m lockstep_train.info --env <slug>.
      - '"{{.PY}}" -m lockstep_train.info --engine out/engine.wasm'

  doctor:
    desc: "Check this machine for everything the template needs — Python version, the venv, lockstep-train, the lockstep CLI, Task, LOCKSTEP_API_KEY, the Rust toolchain for the example agent — and say exactly what is missing and how to fix it."
    cmds:
      # Deliberately runs on the SYSTEM python: the venv is one of the
      # things it checks, so it cannot depend on it.
      - python3 -m train.doctor

  quickstart:
    desc: "Zero decisions: setup → fetch the engine → build the scripted agent → run a real local match → hand you the archive to drop on lockstep.it/replay. ENV="
    cmds:
      - task: setup
        vars: { ENV: "{{.ENV}}" }
      - task: engine
        vars: { ENV: "{{.ENV}}" }
      - task: scripted
        vars: { ENV: "{{.ENV}}" }
      - task: match
        vars: { ENV: "{{.ENV}}", BUNDLE: "out/scripted-bundle" }
      - 'echo ""'
      - 'echo "quickstart: done — out/archive.bin is a real {{.ENV}} match with the scripted agent in every seat."'
      - 'echo "Watch it:   drop out/archive.bin on https://lockstep.it/replay"'
      - 'echo "Read it:    task info ENV={{.ENV}}   (the brief and the wire, in this terminal)"'
      - 'echo "Train one:  task train ENV={{.ENV}}  then task match ENV={{.ENV}}, then task upload ENV={{.ENV}}"'

  train:
    desc: "PPO → ONNX → parity check → stage out/agent-bundle. ENV= MODE= STEPS=8192 NUM_ENVS=(cores-2, max 8) RESUME=1 to continue a crashed run. PARALLEL=1 trains BOTH seats at once (one shared policy over the generic PettingZoo env) on multi-seat environments"
    deps: [engine]
    vars:
      STEPS: '{{.STEPS | default "8192"}}'
    cmds:
      - >-
        "{{.PY}}" -m train.main --env "{{.ENV}}" --steps {{.STEPS}}
        {{if .NUM_ENVS}}--num-envs {{.NUM_ENVS}}{{end}}
        {{if .RESUME}}--resume{{end}}
        {{if .PARALLEL}}--parallel{{end}}
        --engine out/engine.wasm
        --shell out/agent-onnx.wasm

  scripted:
    desc: "Build the NON-trained example agent (examples/scripted_agent.py) → out/scripted-bundle. ENV="
    deps: [engine]
    cmds:
      - '"{{.PY}}" -m examples.scripted_agent --env "{{.ENV}}"'

  rust-agent:
    desc: "Build the pure-Rust example agent → a bare wasm component (needs rustup target add wasm32-wasip2)."
    cmds:
      - cargo build --release --target wasm32-wasip2 --manifest-path examples/rust-agent/Cargo.toml
      - 'echo "→ examples/rust-agent/target/wasm32-wasip2/release/rust_agent.wasm"'
      - 'echo "Run it:  task match BUNDLE=examples/rust-agent/target/wasm32-wasip2/release/rust_agent.wasm"'

  match:
    desc: "Run a real local match with a bundle in both seats. ENV= BUNDLE=out/agent-bundle (the engine's MODE comes from the bundle's lockstep.toml; MODE= only matters for a bare .wasm)"
    vars:
      BUNDLE: '{{.BUNDLE | default "out/agent-bundle"}}'
    preconditions:
      - sh: command -v lockstep
        msg: "lockstep CLI not on PATH — curl -fsSL https://dl.lockstep.it/install.sh | sh"
      - sh: test -f {{.BUNDLE}}/lockstep.toml || test -f {{.BUNDLE}}
        msg: "nothing at {{.BUNDLE}} — `task train`, `task scripted`, or `task rust-agent` first"
    cmds:
      # NOT the plain `engine` dep: that fetches the DEFAULT mode's engine
      # when MODE= is unset, silently replacing the one `task train MODE=x`
      # downloaded — and a mode-mismatched match doesn't fail, it plays out
      # as an agent that can't read a single observation. --bundle lets the
      # bundle's own lockstep.toml pick the engine instead.
      - '"{{.PY}}" -m train.core.engine --env "{{.ENV}}" {{if .MODE}}--mode "{{.MODE}}"{{end}} --bundle "{{.BUNDLE}}" --out out'
      # --clamp-seats: both seats are this bundle; a solo environment clamps
      # to its single seat, a duel keeps two.
      - |
        lockstep match run --slug "{{.ENV}}" \
          --engine out/engine.wasm \
          --agents {{.BUNDLE}} {{.BUNDLE}} \
          --clamp-seats \
          --seed-hex 0703 \
          --out out/archive.bin
      - echo "✓ match archived → out/archive.bin"
      - 'echo "Watch it: drop out/archive.bin on https://lockstep.it/replay"'

  upload:
    desc: "Upload the bundle to compete (or to seal for an assessment). Needs LOCKSTEP_API_KEY in .env. ENV= NAME=my-agent AGENT_ID=<id> for a revision. BUNDLE=out/agent-bundle"
    vars:
      BUNDLE: '{{.BUNDLE | default "out/agent-bundle"}}'
      NAME: '{{.NAME | default "my-agent"}}'
    preconditions:
      - sh: command -v lockstep
        msg: "lockstep CLI not on PATH — curl -fsSL https://dl.lockstep.it/install.sh | sh"
      - sh: test -f {{.BUNDLE}}/lockstep.toml
        msg: "no bundle at {{.BUNDLE}} — run: task train (or task scripted)"
      - sh: test -n "${LOCKSTEP_API_KEY:-}"
        msg: "LOCKSTEP_API_KEY not set — copy .env.example to .env and fill it in"
    cmds:
      - |
        set -e
        if [ -n "{{.AGENT_ID}}" ]; then
          lockstep agent upload --bundle "{{.BUNDLE}}" --agent-id "{{.AGENT_ID}}"
        else
          lockstep agent upload --bundle "{{.BUNDLE}}" \
            --display-name "{{.NAME}}" --environment-id "{{.ENV}}"
        fi

  test:
    desc: "Run the template's own tests. Hermetic ones always run; engine-backed ones (SAME_STEP semantics) need out/engine.wasm (task engine) or LOCKSTEP_TEST_ENGINE=<path>."
    cmds:
      - '"{{.VENV}}/bin/pip" install --quiet pytest'
      - '"{{.PY}}" -m pytest tests -q'
      - cargo test --manifest-path examples/rust-agent/Cargo.toml --quiet
