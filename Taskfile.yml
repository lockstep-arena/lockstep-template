# The template's entire surface. Every task uses the repo-local .venv
# explicitly — no shell activation, no global installs.
#
# GAME=<slug> parameterizes everything: `task setup GAME=x` installs
# lockstep-game-x, and every other task discovers the installed game through
# its training-metadata entry point (no game-specific config lives here —
# the engine URL pin, mode list, etc. all come from the game package).
# dance-off is only the DEFAULT, as the shipped reference game.
version: "3"

# Print what the task SAYS, not the shell line that says it. This is a
# teaching repo: `task train` should read as its own progress output, not as
# an echo of every `"{{.PY}}" -m train.core...` invocation ahead of it.
silent: true

dotenv: [".env"]

vars:
  VENV: "{{.ROOT_DIR}}/.venv"
  PY: "{{.VENV}}/bin/python"
  GAME: '{{.GAME | default "dance-off"}}'

tasks:
  setup:
    desc: "Create .venv and install the training stack + the game package. GAME=dance-off"
    cmds:
      - python3 -m venv "{{.VENV}}"
      - '"{{.VENV}}/bin/pip" install --upgrade pip'
      - '"{{.VENV}}/bin/pip" install -r requirements.txt'
      - '"{{.VENV}}/bin/pip" install "lockstep-game-{{.GAME}}"'
      - 'echo "✓ setup complete — next: task train"'

  engine:
    desc: "Download the game's pinned engine wasm (no-op if unchanged). GAME= MODE="
    cmds:
      # The URL comes from the game package's spec (it pins the release its
      # codec was built against); the helper stamps out/engine.wasm.url so
      # switching GAME/MODE re-downloads and re-runs are no-ops.
      - '"{{.PY}}" -m train.core.engine --game "{{.GAME}}" {{if .MODE}}--mode "{{.MODE}}"{{end}} --out out/engine.wasm'

  train:
    desc: "PPO → ONNX → parity check → stage out/agent-bundle. GAME= MODE= STEPS=8192 NUM_ENVS=(cores-2, max 8) RESUME=1 to continue a crashed run. OPPONENT=<policy.onnx> fills seat 1 with a frozen policy (self-play) on games that support it"
    deps: [engine]
    vars:
      STEPS: '{{.STEPS | default "8192"}}'
    cmds:
      - >-
        "{{.PY}}" -m train.main --game "{{.GAME}}" --steps {{.STEPS}}
        {{if .MODE}}--mode "{{.MODE}}"{{end}}
        {{if .NUM_ENVS}}--num-envs {{.NUM_ENVS}}{{end}}
        {{if .RESUME}}--resume{{end}}
        {{if .OPPONENT}}--opponent "{{.OPPONENT}}"{{end}}
        --engine out/engine.wasm

  scripted:
    desc: "Build the NON-trained example agent (examples/scripted_agent.py) → out/scripted-bundle."
    cmds:
      - '"{{.PY}}" -m examples.scripted_agent'

  contract:
    desc: "Refresh the vendored dance-off.fbs from the CDN release the game package pins (the agent WIT is vendored in this repo and updated with it)."
    cmds:
      - |
        set -e
        # The contract is published NEXT TO the engine wasm of every release,
        # so the refresh is always the contract of the exact engine you train
        # against — same directory, same version, no credentials needed.
        ENGINE_URL="$("{{.PY}}" -m train.core.engine --game "{{.GAME}}" {{if .MODE}}--mode "{{.MODE}}"{{end}} --print-url)"
        CONTRACT_URL="$(dirname "$ENGINE_URL")/contract.fbs"
        curl -fsSL "$CONTRACT_URL" -o examples/rust-agent/contract/dance-off.fbs
        echo "→ refreshed examples/rust-agent/contract/dance-off.fbs"
        echo "  from $CONTRACT_URL"
        echo "  if the .fbs changed, regenerate the bindings:"
        echo "  planus rust -o examples/rust-agent/src/wire.rs examples/rust-agent/contract/dance-off.fbs"

  rust-agent:
    desc: "Build the pure-Rust example agent → a bare wasm component (needs rustup target add wasm32-wasip2)."
    cmds:
      - cargo build --release --target wasm32-wasip2 --manifest-path examples/rust-agent/Cargo.toml
      - 'echo "→ examples/rust-agent/target/wasm32-wasip2/release/rust_agent.wasm"'
      - 'echo "Run it:  task match BUNDLE=examples/rust-agent/target/wasm32-wasip2/release/rust_agent.wasm"'

  match:
    desc: "Run a real local match with a bundle in both seats. GAME= BUNDLE=out/agent-bundle (the engine's MODE comes from the bundle's lockstep.toml; MODE= only matters for a bare .wasm)"
    vars:
      BUNDLE: '{{.BUNDLE | default "out/agent-bundle"}}'
    preconditions:
      - sh: command -v lockstep
        msg: "lockstep CLI not on PATH — curl -fsSL https://dl.lockstep.games/install.sh | sh"
      - sh: test -f {{.BUNDLE}}/lockstep.toml || test -f {{.BUNDLE}}
        msg: "nothing at {{.BUNDLE}} — `task train`, `task scripted`, or `task rust-agent` first"
    cmds:
      # NOT the plain `engine` dep: that fetches the DEFAULT mode's engine
      # when MODE= is unset, silently replacing the one `task train MODE=x`
      # downloaded — and a mode-mismatched match doesn't fail, it plays out
      # as an agent that can't read a single observation. --bundle lets the
      # bundle's own lockstep.toml pick the engine instead.
      - '"{{.PY}}" -m train.core.engine --game "{{.GAME}}" {{if .MODE}}--mode "{{.MODE}}"{{end}} --bundle "{{.BUNDLE}}" --out out/engine.wasm'
      - |
        lockstep match run --slug "{{.GAME}}" \
          --engine out/engine.wasm \
          --agents {{.BUNDLE}} {{.BUNDLE}} \
          --seed-hex 0703 \
          --out out/archive.bin
      - echo "✓ match archived → out/archive.bin"

  upload:
    desc: "Upload the bundle to compete. Needs LOCKSTEP_API_KEY in .env. GAME= NAME=my-agent AGENT_ID=<id> for a revision."
    preconditions:
      - sh: command -v lockstep
        msg: "lockstep CLI not on PATH — curl -fsSL https://dl.lockstep.games/install.sh | sh"
      - sh: test -f out/agent-bundle/lockstep.toml
        msg: "no trained bundle yet — run: task train"
      - sh: test -n "${LOCKSTEP_API_KEY:-}"
        msg: "LOCKSTEP_API_KEY not set — copy .env.example to .env and fill it in"
    vars:
      NAME: '{{.NAME | default "my-agent"}}'
    cmds:
      - |
        set -e
        if [ -n "{{.AGENT_ID}}" ]; then
          lockstep agent upload --bundle out/agent-bundle --agent-id "{{.AGENT_ID}}"
        else
          lockstep agent upload --bundle out/agent-bundle \
            --display-name "{{.NAME}}" --game-id "{{.GAME}}"
        fi

  test:
    desc: "Run the template's own tests (import-lint + vec-env semantics; needs setup + engine)."
    deps: [engine]
    cmds:
      - '"{{.VENV}}/bin/pip" install --quiet pytest'
      - '"{{.PY}}" -m pytest tests -q'
